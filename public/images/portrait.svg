<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 454" width="630" height="454">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12151e"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c49750" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c49750" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1b0"/>
      <stop offset="50%" stop-color="#c49750"/>
      <stop offset="100%" stop-color="#8a6729"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="630" height="454" fill="url(#bg)"/>
  <rect width="630" height="454" fill="url(#glow)"/>

  <!-- Elegant classical frame -->
  <rect x="20" y="20" width="590" height="414" fill="none" stroke="#c49750" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="26" y="26" width="578" height="402" fill="none" stroke="#c49750" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Corner ornaments -->
  <path d="M 20 40 L 40 20 M 610 40 L 590 20 M 20 414 L 40 434 M 610 414 L 590 434" stroke="#c49750" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Center Emblem: Stylized Lyre / Classical Sound Wave -->
  <g transform="translate(315, 180)">
    <!-- Aura rings -->
    <circle r="60" fill="none" stroke="#c49750" stroke-opacity="0.15" stroke-width="1"/>
    <circle r="75" fill="none" stroke="#c49750" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Stylized Classical Lyre Icon -->
    <path d="M -24 -35 C -24 0, -20 25, 0 35 C 20 25, 24 0, 24 -35 M -12 -35 L -12 28 M 0 -35 L 0 34 M 12 -35 L 12 28" 
          fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Crossbar -->
    <line x1="-30" y1="-32" x2="30" y2="-32" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Base -->
    <ellipse cx="0" cy="40" rx="14" ry="4" fill="url(#gold)"/>
  </g>

  <!-- Typography -->
  <text x="315" y="295" font-family="serif" font-size="24" fill="#f4f2ec" text-anchor="middle" letter-spacing="3" font-weight="normal">ABDELLAH LASRI</text>
  <text x="315" y="325" font-family="monospace" font-size="11" fill="#c49750" text-anchor="middle" letter-spacing="4">OPERA TENOR · VOCAL &amp; MUSIC MENTOR</text>
  <text x="315" y="365" font-family="sans-serif" font-size="11" fill="#8c887d" text-anchor="middle" letter-spacing="1">Click &quot;Upload My Real Photo&quot; to display your portrait</text>
</svg>
